services:
  backend:
    build: ./backend
    env_file: ./backend/.env # API key etc. Git-ignored. Copy backend/.env.example to backend/.env
    environment:
      - PORT=5000
    ports:
      - "5002:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
